server:
  port: 8082
  shutdown: graceful

spring:
  application:
    name: catalog-service
  config:
    import:
      - classpath:ecommerce-common.yml
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/catalog_db
    username: catalog_user
    password: ${CATALOG_DB_PASSWORD}
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

app:
  media:
    # NFR-SEC-010: lưu NGOÀI thư mục code/classpath, server không bao giờ "chạy" file trong đây
    storage-dir: ${MEDIA_STORAGE_DIR:data/media}
    max-size: 5MB
    max-images-per-product: 20
    public-base-path: /api/v1/media

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.ecommerce: DEBUG
